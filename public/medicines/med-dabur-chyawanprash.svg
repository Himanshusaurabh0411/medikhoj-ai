    <!-- 1. Metallic Gold Screw Cap -->
    <rect x="130" y="45" width="130" height="45" rx="10" fill="url(#gold-cap)" stroke="#B45309" stroke-width="1.2" />
    
      <line x1="138" y1="48" x2="138" y2="86" stroke="#78350F" stroke-width="1.8" opacity="0.4" />
      <line x1="139" y1="48" x2="139" y2="86" stroke="#FEF3C7" stroke-width="1" opacity="0.5" />
    
      <line x1="147" y1="48" x2="147" y2="86" stroke="#78350F" stroke-width="1.8" opacity="0.4" />
      <line x1="148" y1="48" x2="148" y2="86" stroke="#FEF3C7" stroke-width="1" opacity="0.5" />
    
      <line x1="156" y1="48" x2="156" y2="86" stroke="#78350F" stroke-width="1.8" opacity="0.4" />
      <line x1="157" y1="48" x2="157" y2="86" stroke="#FEF3C7" stroke-width="1" opacity="0.5" />
    
      <line x1="165" y1="48" x2="165" y2="86" stroke="#78350F" stroke-width="1.8" opacity="0.4" />
      <line x1="166" y1="48" x2="166" y2="86" stroke="#FEF3C7" stroke-width="1" opacity="0.5" />
    
      <line x1="174" y1="48" x2="174" y2="86" stroke="#78350F" stroke-width="1.8" opacity="0.4" />
      <line x1="175" y1="48" x2="175" y2="86" stroke="#FEF3C7" stroke-width="1" opacity="0.5" />
    
      <line x1="183" y1="48" x2="183" y2="86" stroke="#78350F" stroke-width="1.8" opacity="0.4" />
      <line x1="184" y1="48" x2="184" y2="86" stroke="#FEF3C7" stroke-width="1" opacity="0.5" />
    
      <line x1="192" y1="48" x2="192" y2="86" stroke="#78350F" stroke-width="1.8" opacity="0.4" />
      <line x1="193" y1="48" x2="193" y2="86" stroke="#FEF3C7" stroke-width="1" opacity="0.5" />
    
      <line x1="201" y1="48" x2="201" y2="86" stroke="#78350F" stroke-width="1.8" opacity="0.4" />
      <line x1="202" y1="48" x2="202" y2="86" stroke="#FEF3C7" stroke-width="1" opacity="0.5" />
    
      <line x1="210" y1="48" x2="210" y2="86" stroke="#78350F" stroke-width="1.8" opacity="0.4" />
      <line x1="211" y1="48" x2="211" y2="86" stroke="#FEF3C7" stroke-width="1" opacity="0.5" />
    
      <line x1="219" y1="48" x2="219" y2="86" stroke="#78350F" stroke-width="1.8" opacity="0.4" />
      <line x1="220" y1="48" x2="220" y2="86" stroke="#FEF3C7" stroke-width="1" opacity="0.5" />
    
      <line x1="228" y1="48" x2="228" y2="86" stroke="#78350F" stroke-width="1.8" opacity="0.4" />
      <line x1="229" y1="48" x2="229" y2="86" stroke="#FEF3C7" stroke-width="1" opacity="0.5" />
    
      <line x1="237" y1="48" x2="237" y2="86" stroke="#78350F" stroke-width="1.8" opacity="0.4" />
      <line x1="238" y1="48" x2="238" y2="86" stroke="#FEF3C7" stroke-width="1" opacity="0.5" />
    
      <line x1="246" y1="48" x2="246" y2="86" stroke="#78350F" stroke-width="1.8" opacity="0.4" />
      <line x1="247" y1="48" x2="247" y2="86" stroke="#FEF3C7" stroke-width="1" opacity="0.5" />
    

    <!-- 2. Jar Neck Ring -->
    <rect x="135" y="90" width="120" height="12" rx="4" fill="#78350F" stroke="#451A03" stroke-width="1" />

    <!-- 3. Wide Jar Body -->
    <rect x="105" y="102" width="180" height="230" rx="26" fill="url(#jar-body)" stroke="#451A03" stroke-width="1.5" />
    
    <!-- Specular Highlight Column -->
    <rect x="130" y="110" width="22" height="210" rx="10" fill="#FFFFFF" opacity="0.25" />

